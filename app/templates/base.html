<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ERP{% endblock %} — Учёт доходов/расходов</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="/">ERP</a>
        <button class="menu-toggle" type="button" aria-label="Меню" onclick="document.querySelector('.nav-links').classList.toggle('open')">
            ☰
        </button>
        <ul class="nav-links">
            <li><a href="/operations">Операции</a></li>
            <li><a href="/categories">Категории</a></li>
            <li><a href="/report-groups">Группы отчёта</a></li>
            <li><a href="/suppliers">Поставщики</a></li>
            <li><a href="/products">Продукты</a></li>
            <li><a href="/employees">Сотрудники</a></li>
            <li><a href="/stats">Графики</a></li>
            <li><a href="/sync">Синхронизация</a></li>
            <li><a href="/backups">Бэкапы</a></li>
            <li><a href="/logout">Выход</a></li>
        </ul>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/js/app.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
