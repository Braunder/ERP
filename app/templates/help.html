<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — ERP</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            background: linear-gradient(180deg, #f5f8ff 0%, #eef4fb 100%);
            margin: 0;
            font-family: Arial, sans-serif;
            color: #1f2937;
        }

        .help-shell {
            max-width: 1100px;
            margin: 32px auto 80px;
            padding: 0 18px;
        }

        .help-header {
            background: linear-gradient(135deg, #0d6efd 0%, #2563eb 100%);
            color: white;
            border-radius: 18px 18px 0 0;
            padding: 28px 28px 24px;
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.18);
        }

        .help-header h1 {
            margin: 0;
            font-size: 2rem;
        }

        .help-header p {
            margin: 10px 0 0;
            opacity: 0.9;
        }

        .help-content {
            background: white;
            border-radius: 0 0 18px 18px;
            border: 1px solid #dfe7f1;
            border-top: none;
            padding: 24px 28px 40px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
        }

        .help-card {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 20px 22px;
            margin-bottom: 18px;
        }

        .help-card h2 {
            margin: 0 0 12px;
            font-size: 1.3rem;
            color: #0f172a;
        }

        .help-card ul {
            margin: 0;
            padding-left: 20px;
            color: #374151;
            line-height: 1.7;
        }

        li + li {
            margin-top: 6px;
        }

        .quick-badge {
            display: inline-block;
            margin-right: 8px;
            margin-bottom: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            background: #e0ecff;
            color: #1d4ed8;
            font-size: 0.8rem;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .help-shell {
                padding: 0 10px;
                margin-top: 20px;
            }

            .help-header,
            .help-content {
                padding-left: 16px;
                padding-right: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="help-shell">
        <header class="help-header">
            <h1>Помощь по ERP</h1>
            <p>Короткая памятка по работе в системе: операции, категории, статистика, Google Таблица и бэкапы.</p>
        </header>

        <main class="help-content">
            <div class="quick-badge">Вход</div>
            <div class="quick-badge">Операции</div>
            <div class="quick-badge">Статистика</div>
            <div class="quick-badge">Таблица</div>
            <div class="quick-badge">Бэкапы</div>

            {% for section in sections %}
                <section class="help-card">
                    <h2>{{ section.title }}</h2>
                    <ul>
                        {% for item in section.items %}
                            <li>{{ item }}</li>
                        {% endfor %}
                    </ul>
                </section>
            {% endfor %}
        </main>
    </div>
</body>
</html>
